[package]
name = "mytodo"
version = "1.2.0"
description = "mytodo — Tauri desktop app"
authors = ["lexandro"]
edition = "2021"

[lib]
# A `_lib` utótag kell: Windowson a lib- és bin-név nem ütközhet
# (https://github.com/rust-lang/cargo/issues/8519)
name = "mytodo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# description links: URL -> default browser, path -> Explorer/associated app
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# date-stamped backup filenames (todo-YYYY-MM-DD.db)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# bundled: nincs rendszer-SQLite függőség — a portable exe önálló marad
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# live update from GitHub Releases (signed artifacts + latest.json)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Windows integration: IVirtualDesktopManager (Summon), monitor placement,
# foreground activation — documented Win32/COM APIs only
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

# kis és gyors release exe (méret-optimalizált)
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
