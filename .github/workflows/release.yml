name: Release

# Push a version tag (e.g. v1.0.0) → build the signed Windows installers
# (MSI + NSIS) with updater artifacts + latest.json, publish them as a live
# GitHub Release. The in-app updater feeds from
# releases/latest/download/latest.json. Also attaches a portable zip.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # The About dialog shows the package.json version, so a tag that does
      # not match the bumped version would make the app lie about itself.
      - name: Verify the tag matches the bumped version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "tag=$tag package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
          if ($pkg -ne $tag -or $conf -ne $tag -or $cargo -ne $tag) {
            Write-Error "Version mismatch - bump package.json, tauri.conf.json and Cargo.toml to $tag"
            exit 1
          }

      - name: Unit tests
        run: bun run test

      # The release notes are the tag's own CHANGELOG section — the same text
      # the app shows under Help → What's new, so the two can never drift.
      - name: Release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($tag))( |$)" | Select-Object -First 1).LineNumber
          if (-not $start) {
            Write-Error "CHANGELOG.md has no '## $tag' section - add it before tagging"
            exit 1
          }
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $notes = ($body -join "`n").Trim()
          $install = @'

## Install

- **Installer**: `myTODO_x.y.z_x64-setup.exe` (NSIS) or the `.msi` - installed
  copies update themselves from here.
- **Portable**: `myTODO-<tag>-portable.zip` - unzip and run, data stays in the
  folder.

Full changelog: [CHANGELOG.md](https://github.com/lexandro/mytodo/blob/main/CHANGELOG.md)
'@
          "body<<CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          ($notes + "`n" + $install) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "release notes: $($notes.Length) chars"

      - name: Build app + publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signed auto-updates. Keypair lives in the owner's key vault;
          # secrets: Settings → Secrets → Actions.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Marks the bundled frontend as an official build: the About dialog
          # then shows a bare "1.0.1" instead of "1.0.1-dev". The git hash is
          # read from the checkout by vite.config.js.
          MYTODO_BUILD_CHANNEL: release
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "myTODO ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: Assemble portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\myTODO\data, release\myTODO\backup | Out-Null
          Copy-Item target\release\mytodo.exe release\myTODO\myTODO.exe
          Compress-Archive -Path release\myTODO -DestinationPath "myTODO-${{ github.ref_name }}-portable.zip"

      - name: Attach portable zip to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "myTODO-${{ github.ref_name }}-portable.zip" --clobber
